<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ring/Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Masked Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="10 15" opacity="0.6" />

  <!-- Glowing Abstract 'N' & Orbit Geometry (Representing 360 Degree Banking) -->
  <g filter="url(#glow)" transform="translate(128, 128)">
    <!-- Orbit Ring -->
    <ellipse cx="128" cy="128" rx="120" ry="40" fill="none" stroke="url(#brandGrad)" stroke-width="12" transform="rotate(-30 128 128)" opacity="0.8" />
    
    <!-- Central Node 1 (Violet) -->
    <circle cx="68" cy="80" r="14" fill="#7c3aed" />
    
    <!-- Central Node 2 (Cyan) -->
    <circle cx="188" cy="176" r="14" fill="#00d4ff" />

    <!-- Sleek Futuristic Monogram -->
    <path d="M70,170 L70,86 C70,72 82,60 96,60 L104,60 C118,60 130,72 130,86 L130,170 C130,184 142,196 156,196 L164,196 C178,196 190,184 190,170 L190,86" 
          fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Core Center -->
  <circle cx="256" cy="256" r="16" fill="#00d4ff" filter="url(#glow)" />
</svg>
